<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>execlab</title>
    <style>
      html,
      body {
        margin: 0;
        font-size: 16.5px;
        background: #e8ecf3;
        color-scheme: light;
        scrollbar-width: thin;
      }
      * {
        box-sizing: border-box;
      }
      button,
      select,
      input,
      textarea {
        font-family: inherit;
      }
      /* Interactive behavior lives in classes (inline styles can't carry
         :hover/:focus); colors stay theme-agnostic via currentColor and
         filter so the same classes work in both palettes. */
      .btn {
        transition:
          filter 0.15s ease,
          transform 0.1s ease,
          box-shadow 0.15s ease,
          opacity 0.15s ease;
      }
      .btn:hover:not(:disabled) {
        filter: brightness(1.07);
      }
      .btn:active:not(:disabled) {
        transform: translateY(1px);
      }
      .btn:disabled {
        opacity: 0.45;
        cursor: not-allowed;
      }
      .hoverable {
        transition: background 0.12s ease;
      }
      .hoverable:hover {
        background: color-mix(in srgb, currentColor 7%, transparent);
      }
      .raise {
        transition:
          box-shadow 0.15s ease,
          transform 0.15s ease;
      }
      .raise:hover {
        transform: translateY(-1px);
        box-shadow:
          0 2px 4px color-mix(in srgb, currentColor 10%, transparent),
          0 6px 16px color-mix(in srgb, currentColor 8%, transparent);
      }
      :focus-visible {
        outline: 2px solid #3b82f6;
        outline-offset: 2px;
        border-radius: 4px;
      }
      .fade {
        animation: fade-up 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      }
      /* Everything that is not explicitly instant eases on the same curve,
         so panels, chips and tints settle rather than snap. */
      button,
      select,
      input,
      textarea,
      .tile,
      .card-lift {
        transition:
          background 0.16s ease,
          border-color 0.16s ease,
          color 0.16s ease,
          box-shadow 0.18s ease,
          transform 0.14s cubic-bezier(0.22, 1, 0.36, 1);
      }
      .card-lift:hover {
        transform: translateY(-2px);
      }
      @keyframes fade-up {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      /* Faint vignette so the page doesn't read as one flat fill; tints
         with the text color, so it follows the theme. */
      .shell-decor {
        background-image: radial-gradient(
          900px 340px at 18% -6%,
          color-mix(in srgb, currentColor 4%, transparent),
          transparent 70%
        );
      }
      /* Cards cascade in: each direct child of a page enters with a small
         stagger, so screens assemble instead of popping. */
      .page > * {
        animation: fade-up 0.3s ease both;
      }
      .page > *:nth-child(2) {
        animation-delay: 0.05s;
      }
      .page > *:nth-child(3) {
        animation-delay: 0.1s;
      }
      .page > *:nth-child(4) {
        animation-delay: 0.15s;
      }
      .page > *:nth-child(5) {
        animation-delay: 0.2s;
      }
      .page > *:nth-child(n + 6) {
        animation-delay: 0.25s;
      }
      /* Calendar cells pop slightly on hover. */
      .cell-pop {
        transition:
          transform 0.12s ease,
          filter 0.15s ease,
          box-shadow 0.15s ease;
      }
      .cell-pop:hover {
        transform: scale(1.08);
      }
      /* Leaderboard bars sweep out from the left on entry. */
      .grow-x {
        transform-origin: left center;
        animation: grow-x 0.6s cubic-bezier(0.22, 1, 0.36, 1) both;
        animation-delay: 0.25s;
      }
      @keyframes grow-x {
        from {
          transform: scaleX(0);
        }
      }
      @media (max-width: 760px) {
        .page {
          margin: 8px auto !important;
          padding: 12px !important;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .fade,
        .btn,
        .raise,
        .hoverable,
        .page > *,
        .cell-pop,
        .grow-x {
          animation: none;
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script src="../../_build/default/app/ui/main.bc.js"></script>
  </body>
</html>
