name: CI

# Build the project, run the test suite, and check formatting on every push to
# main and every pull request. Uses ocaml/setup-ocaml to install a fresh opam
# switch and the project's dependencies, so the workflow is self-contained --
# no prebuilt image required.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run if a newer commit is pushed to the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "5.2"

      - name: Install dependencies
        run: opam install . --deps-only --with-test

      # app/ui is deliberately excluded from every step below: the Bonsai
      # web client builds against Jane Street preview releases
      # (v0.18~preview) and the OxCaml-patched toolchain, neither of which
      # is installable from the public opam repository this workflow uses.
      # CI covers the pure-OCaml engine and CLI; the UI builds locally with
      # `dune build app/ui/main.bc.js`.
      - name: Build (engine + CLI)
        run: opam exec -- dune build lib bin

      - name: Run tests
        run: opam exec -- dune runtest lib

      # No formatting check: this repo is formatted with the OxCaml-patched
      # ocamlformat (0.26.2+ox1), which disagrees with the public 0.26.2
      # about the canonical layout of identical code (first-class-module
      # argument docking, comment reflow) — so no single formatting can
      # satisfy both checkers. Formatting is enforced locally by `dune fmt`.
